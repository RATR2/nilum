name: Build

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nilum
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Detects a bot version-bump commit (avoids an infinite loop), whether this
      # commit requested a version bump via "version=X.Y.Z", and whether it opted
      # out of mirroring via "workflows.ignore=true".
      - name: Classify commit
        id: classify
        run: |
          # Both flags must be their own line (like a git trailer), not just a
          # substring anywhere in the message - otherwise a commit that merely
          # *talks about* "version=X.Y.Z" or "workflows.ignore=true" in prose
          # (e.g. this very line) would trigger itself by accident.
          MSG=$(git log -1 --pretty=%B)

          # Bot detection can't key off github.actor: bump-version.sh pushes with
          # a real PAT (not the default GITHUB_TOKEN) so its commit actually
          # retriggers a run, but that means GitHub attributes the push to the
          # PAT's owner, not github-actions[bot]. Match bump-version.sh's exact
          # commit *subject* instead - a plain substring check on the full
          # message would also match any commit that merely *talks about*
          # "[ci-bump]" in prose (as this comment itself now does).
          SUBJECT=$(git log -1 --pretty=%s)
          IS_BOT="false"
          if echo "$SUBJECT" | grep -qxE 'chore: bump version to [0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)? \[ci-bump\]'; then
            IS_BOT="true"
          fi

          VERSION=""
          if echo "$MSG" | grep -qxE 'version=[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?'; then
            VERSION=$(echo "$MSG" | grep -oxE 'version=[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?' | head -1 | cut -d= -f2)
          fi

          IGNORE="false"
          if echo "$MSG" | grep -qxE 'workflows\.ignore=true'; then
            IGNORE="true"
          fi

          echo "is_bot=$IS_BOT" >> "$GITHUB_OUTPUT"
          echo "requested_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ignore=$IGNORE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.classify.outputs.is_bot == 'false' && steps.classify.outputs.requested_version != '' && steps.classify.outputs.ignore != 'true'
        env:
          NILUM_BUILDS_TOKEN: ${{ secrets.NILUM_BUILDS_TOKEN }}
        run: scripts/ci/bump-version.sh "${{ steps.classify.outputs.requested_version }}"

      - name: Build and mirror commit to nilum-builds
        if: steps.classify.outputs.is_bot == 'false' && steps.classify.outputs.requested_version == '' && steps.classify.outputs.ignore != 'true'
        env:
          NILUM_BUILDS_TOKEN: ${{ secrets.NILUM_BUILDS_TOKEN }}
          COMMIT_SHA: ${{ steps.classify.outputs.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: scripts/ci/build-and-mirror.sh

      # Doesn't build anything - just records that this commit exists, so
      # nilum-builds' "Last Commit" can outpace "Last Build" when a commit
      # is intentionally skipped.
      - name: Record ignored commit in nilum-builds
        if: steps.classify.outputs.is_bot == 'false' && steps.classify.outputs.ignore == 'true'
        env:
          NILUM_BUILDS_TOKEN: ${{ secrets.NILUM_BUILDS_TOKEN }}
          COMMIT_SHA: ${{ steps.classify.outputs.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: scripts/ci/record-ignored-commit.sh

      - name: Build and publish release branch to nilum-builds
        if: steps.classify.outputs.is_bot == 'true'
        env:
          NILUM_BUILDS_TOKEN: ${{ secrets.NILUM_BUILDS_TOKEN }}
          COMMIT_SHA: ${{ steps.classify.outputs.sha }}
        run: scripts/ci/build-and-publish-branch.sh
